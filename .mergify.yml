scopes:
  source:
    files:
      critical:
        include:
          - "**"
        exclude:
          - "safe/**"

merge_queue:
  mode: serial

queue_rules:
  - name: default
    queue_conditions: []
    merge_conditions:
      - check-success = vm2-whitespace-ci
    merge_method: merge

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= read

pull_request_rules:
  - name: VM2 locked revocation freshness gate
    conditions:
      - locked = true
      - title = VM2_LOCKED_ARM_0928
      - check-success = vm2-whitespace-ci
    actions:
      merge:
        method: merge
