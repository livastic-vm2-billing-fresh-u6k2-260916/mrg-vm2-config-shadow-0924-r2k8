scopes:
  source:
    files:
      critical:
        include:
          - "**"
        exclude:
          - "safe/**"

merge_queue:
  mode: serial

queue_rules:
  - name: default
    queue_conditions: []
    merge_conditions:
      - check-success = vm2-whitespace-ci
    merge_method: merge

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= read
